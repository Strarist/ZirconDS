<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download property pictures — ZirconDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .dl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .dl-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s var(--ease), border-color 0.18s ease;
    }
    .dl-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
    }
    .dl-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e7efe9;
      display: block;
    }
    .dl-card .meta {
      padding: 0.75rem 0.85rem 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .dl-card .meta span {
      color: var(--muted);
      font-size: 0.8rem;
      word-break: break-all;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }
    a.back {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .note {
      color: var(--muted);
      font-size: 0.88rem;
      margin: -0.15rem 0 1.1rem;
    }
    .sub { color: var(--muted); margin: 0 0 1rem; }
    h1.page-title {
      font-family: Fraunces, Georgia, serif;
      margin: 0.75rem 0 0.35rem;
      letter-spacing: -0.03em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-bar" aria-label="ZirconDS">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name">ZirconDS</div>
        <div class="brand-tag">Pictures</div>
      </div>
    </div>
    <div class="topbar">
      <a class="back" href="/">← Back to verification</a>
    </div>
    <h1 class="page-title" id="title">Property pictures</h1>
    <p class="sub" id="subtitle">Loading…</p>
    <p class="note">Images open through the verification proxy when needed; S3 links download directly.</p>
    <div id="content" class="loading"><strong>Loading</strong>Fetching gallery…</div>
  </div>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function filenameFromUrl(url, index) {
      try {
        const path = new URL(url).pathname;
        const base = path.split("/").filter(Boolean).pop() || `image-${index + 1}.jpg`;
        return base.includes(".") ? base : `${base}.jpg`;
      } catch {
        return `image-${index + 1}.jpg`;
      }
    }

    function proxyHref(url, filename) {
      const host = (() => {
        try { return new URL(url).hostname; } catch { return ""; }
      })();
      if (host.includes("zircondsphotos.s3")) return url;
      return `/proxy-image?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(filename)}`;
    }

    async function boot() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const content = document.getElementById("content");
      if (!slug) {
        content.className = "error";
        content.textContent = "Missing slug query parameter.";
        document.getElementById("subtitle").textContent = "";
        return;
      }
      try {
        const res = await fetch("/data/properties.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const record = Array.isArray(data) ? data.find((r) => r.slug === slug) : null;
        if (!record) {
          content.className = "error";
          content.textContent = `No record found for slug “${slug}”.`;
          document.getElementById("subtitle").textContent = "";
          return;
        }
        const images = Array.isArray(record.images)
          ? record.images.map((img) => (typeof img === "string" ? img : (img && img.url))).filter(Boolean)
          : (Array.isArray(record.imageUrls) ? record.imageUrls.filter(Boolean) : []);
        document.getElementById("title").textContent = record.projectName || record.title || "Property pictures";
        document.getElementById("subtitle").textContent =
          `${images.length} image(s) · ${record.bhk != null ? record.bhk + " BHK · " : ""}${record.slug || ""}`;
        document.title = `Download — ${record.projectName || slug}`;

        if (!images.length) {
          content.className = "empty";
          content.innerHTML = "<strong>No images</strong>Nothing was extracted for this property.";
          return;
        }

        content.className = "dl-grid";
        content.innerHTML = images.map((url, i) => {
          const name = filenameFromUrl(url, i);
          const downloadUrl = proxyHref(url, name);
          return `
            <article class="dl-card">
              <img src="${escapeHtml(url)}" alt="Property image ${i + 1}" loading="lazy" />
              <div class="meta">
                <span>${escapeHtml(name)}</span>
                <a class="button" href="${escapeHtml(downloadUrl)}" download="${escapeHtml(name)}">Download</a>
              </div>
            </article>
          `;
        }).join("");
      } catch (err) {
        content.className = "error";
        content.textContent = `Failed to load: ${err.message}`;
      }
    }

    boot();
  </script>
</body>
</html>
