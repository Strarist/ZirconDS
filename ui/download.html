<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download property pictures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c2420;
      --muted: #5c6a63;
      --line: #c9d5ce;
      --panel: rgba(255, 252, 246, 0.92);
      --accent: #0f6b4c;
      --shadow: 0 18px 40px rgba(28, 36, 32, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at top left, #dff0e7 0%, transparent 42%),
        linear-gradient(180deg, #f7f3ea 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }
    a.back {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      margin: 0.75rem 0 0.35rem;
      letter-spacing: -0.03em;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 1.25rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }
    .note {
      color: var(--muted);
      font-size: 0.88rem;
      margin: -0.35rem 0 1.1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e7efe9;
      display: block;
    }
    .card .meta {
      padding: 0.75rem 0.85rem 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .card .meta span {
      color: var(--muted);
      font-size: 0.8rem;
      word-break: break-all;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .empty, .error, .loading {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255,252,246,0.7);
    }
    .error { color: #8a4b12; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/">← Back to verification</a>
    </div>
    <h1 id="title">Property pictures</h1>
    <p class="sub" id="subtitle">Loading…</p>
    <p class="note">Each Download link saves the image through the local verification server (CDN proxy).</p>
    <div id="content" class="loading">Loading images…</div>
  </div>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function filenameFromUrl(url, index) {
      try {
        const path = new URL(url).pathname;
        const base = path.split("/").filter(Boolean).pop() || `image-${index + 1}`;
        return base.includes(".") ? base : `${base}.jpg`;
      } catch {
        return `image-${index + 1}.jpg`;
      }
    }

    function proxyHref(url, filename) {
      const params = new URLSearchParams({
        url,
        filename,
      });
      return `/proxy-image?${params.toString()}`;
    }

    async function boot() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const content = document.getElementById("content");
      if (!slug) {
        content.className = "error";
        content.textContent = "Missing slug query parameter.";
        document.getElementById("subtitle").textContent = "";
        return;
      }
      try {
        const res = await fetch("/data/properties.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const record = Array.isArray(data) ? data.find((r) => r.slug === slug) : null;
        if (!record) {
          content.className = "error";
          content.textContent = `No record found for slug “${slug}”.`;
          document.getElementById("subtitle").textContent = "";
          return;
        }
        const images = Array.isArray(record.imageUrls) ? record.imageUrls.filter(Boolean) : [];
        document.getElementById("title").textContent = record.projectName || record.title || "Property pictures";
        document.getElementById("subtitle").textContent =
          `${images.length} image(s) · ${record.bhk != null ? record.bhk + " BHK · " : ""}${record.slug || ""}`;
        document.title = `Download — ${record.projectName || slug}`;

        if (!images.length) {
          content.className = "empty";
          content.textContent = "No images were extracted for this property.";
          return;
        }

        content.className = "grid";
        content.innerHTML = images.map((url, i) => {
          const name = filenameFromUrl(url, i);
          const downloadUrl = proxyHref(url, name);
          return `
            <article class="card">
              <img src="${escapeHtml(url)}" alt="Property image ${i + 1}" loading="lazy" />
              <div class="meta">
                <span>${escapeHtml(name)}</span>
                <a class="button" href="${escapeHtml(downloadUrl)}" download="${escapeHtml(name)}">Download</a>
              </div>
            </article>
          `;
        }).join("");
      } catch (err) {
        content.className = "error";
        content.textContent = `Failed to load: ${err.message}`;
      }
    }

    boot();
  </script>
</body>
</html>
