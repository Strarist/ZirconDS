  <text x="860" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Archive</text>

  <line x1="190" y1="98" x2="230" y2="98" stroke="#0f6b4c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="98" x2="420" y2="98" stroke="#0f6b4c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="98" x2="610" y2="98" stroke="#0f6b4c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="98" x2="800" y2="98" stroke="#0f6b4c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="180" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6a63">Sources</text>
  <rect x="40" y="195" width="110" height="36" rx="18" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="95" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c2420">100acress</text>
  <rect x="160" y="195" width="100" height="36" rx="18" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="210" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c2420">99acres</text>
  <rect x="270" y="195" width="100" height="36" rx="18" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="320" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c2420">Housing</text>
  <rect x="380" y="195" width="120" height="36" rx="18" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="440" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c2420">MagicBricks</text>
  <rect x="510" y="195" width="120" height="36" rx="18" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="570" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c2420">SquareYards</text>

  <text x="40" y="260" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6a63">One JSON object per BHK/unit · cross-source enrich · never invent price / area / RERA</text>
