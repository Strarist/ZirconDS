<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="ZirconDS architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#eaf2ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f6b4c"/>
    </marker>
  </defs>
  <rect width="960" height="280" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1c2420">ZirconDS multi-source pipeline</text>

  <rect x="40" y="70" width="150" height="56" rx="12" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="115" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2420">Discover</text>

  <rect x="230" y="70" width="150" height="56" rx="12" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="305" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2420">Skip known</text>

  <rect x="420" y="70" width="150" height="56" rx="12" fill="#fffdf8" stroke="#c9d5ce"/>
  <text x="495" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2420">Fetch units</text>

  <rect x="610" y="70" width="150" height="56" rx="12" fill="#d8eee4" stroke="#0f6b4c"/>
  <text x="685" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0f6b4c">Null-fill merge</text>

